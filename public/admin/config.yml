# Sveltia CMS configuration — editing UI at https://uncvl.xyz/admin/
# Docs: https://sveltiacms.app/en/docs
#
# Login: "Sign in with Codeberg" (OAuth PKCE, no auth server needed).
# One-time setup: create an OAuth2 application on Codeberg
#   (Settings → Applications → OAuth2 applications, "Confidential client" UNCHECKED)
#   Redirect URI: https://uncvl.xyz/admin/   (+ http://localhost:8080/admin/ for local testing)
# and paste its Client ID into `app_id` below.
# Without an app_id, editors can still sign in with a Codeberg personal access token.

backend:
  name: forgejo
  repo: Uncivilization/uncvl.xyz
  api_root: https://codeberg.org/api/v1
  base_url: https://codeberg.org
  branch: main
  app_id: "3502c07f-04f0-41bc-afb4-86018e68415f"   # Codeberg OAuth2 app "uncvl.xyz admin panel" (public client, PKCE)
  commit_messages:
    create: "content: add {{collection}} “{{slug}}”"
    update: "content: update {{collection}} “{{slug}}”"
    delete: "content: delete {{collection}} “{{slug}}”"
    uploadMedia: "media: upload “{{path}}”"
    deleteMedia: "media: delete “{{path}}”"

# Changes go to a review branch + pull request first; publishing merges them.
# Remove this line to commit straight to main.
publish_mode: editorial_workflow

site_url: https://uncvl.xyz
display_url: https://uncvl.xyz
logo:
  src: /favicon.svg

# Images and videos go straight to Cloudflare R2 (bucket uncvl-media, served at media.uncvl.xyz)
# through the site's own endpoint (/api/media, worker/index.js). It checks your Codeberg login,
# so there is no key to enter. Files are shrunk to WebP in the browser before uploading.
media_libraries:
  default: false            # nothing is committed to git
  stock_assets: false       # no Unsplash/Pexels/Pixabay/Picsum; our R2 library is the only (and default) one
  aws_s3:
    label: Uncivilization media (R2)
    endpoint: https://uncvl.xyz/api/media/s3
    bucket: uncvl-media
    region: auto
    access_key_id: codeberg-login   # not a secret; the endpoint authenticates your Codeberg login
    public_url: https://media.uncvl.xyz
    prefix: uploads/
  all:
    max_file_size: 52428800         # 50 MB (videos)
    slugify_filename: true
    filename_template: "{{filename}}-{{uuid_short}}"
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2400
        height: 2400


slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # ------------------------------------------------------------------ EVENTS
  - name: events
    label: Events / Etkinlikler
    label_singular: Event
    folder: src/events
    path: "{{year}}-{{month}}-{{day}}-{{slug}}/index"
    create: true
    extension: md
    format: frontmatter
    summary: "{{date | date('YYYY-MM-DD')}} · {{title}}"
    sortable_fields: [date, title]
    view_groups:
      - { label: Event type, field: category }
    fields:
      - { name: title, label: Title, widget: string, hint: "e.g. Thursday Breaks #3" }
      - { name: codename, label: Codename, widget: string, required: false, hint: "CS-flavoured handle shown as the glitch title, e.g. zero day exploit" }
      - { name: category, label: Event type / Etkinlik türü, widget: select, options: [{ label: Bass, value: bass }, { label: Breaks, value: break }, { label: Punk, value: punk }, { label: Synth, value: synth }, { label: Art, value: art }], multiple: true, hint: "Pick one or more. Groups the event on the events page (an event with two types shows in both)." }
      - { name: series, label: Series, widget: string, required: false, hint: "e.g. Thursday Breaks, Bass Night" }
      - { name: activities, label: Event content / Etkinlik içeriği, widget: relation, collection: settings, file: vocab, value_field: "activities.*.en", search_fields: ["activities.*.en", "activities.*.tr"], display_fields: ["activities.*.en"], multiple: true, required: false, hint: "What the event offers: Music, Exhibition, Art Market, Workshop… Pick one or more. Add new ones under Site texts → Lists." }
      - { name: flavor, label: Event flavor, widget: string, required: false, hint: "Free text, shown above the title, e.g. bass ⤬ breaks ⤬ core or bass breaks core + punk" }
      - { name: music_genres, label: Music genres / Müzik türleri, widget: relation, collection: genres, value_field: name, search_fields: [name], display_fields: [name], multiple: true, required: false, hint: "Type to search, pick one or more. Manage the list under Sound → Genres." }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: doors, label: Doors open, widget: string, required: false, hint: "21:00" }
      - { name: stage, label: Stage time, widget: string, required: false, hint: "22:00 or 20:45 - 01:15" }
      - name: venue
        label: Venue
        widget: object
        fields:
          - { name: name, label: Name, widget: string }
          - { name: city, label: City, widget: string, default: İzmir }
      - { name: price, label: Price, widget: string, required: false, hint: "150TL" }
      - { name: poster, label: Poster, widget: image, required: false }
      - { name: poster_alt, label: Poster description (alt text), widget: string, required: false }
      - { name: cover, label: Square cover (optional), widget: image, required: false, hint: "Used in grids. Falls back to the poster." }
      - { name: poster_credit, label: Credit / Emeği geçenler, widget: text, required: false, hint: "shown under the poster, e.g. Artwork: …, Poster design: …" }
      - { name: text_en, label: Event text (EN), widget: markdown, required: false }
      - { name: text_tr, label: Etkinlik metni (TR), widget: markdown, required: false }
      - { name: tickets_en, label: Tickets (EN), widget: markdown, required: false }
      - { name: tickets_tr, label: Bilet (TR), widget: markdown, required: false }
      - name: lineup
        label: Lineup / Kadro
        widget: list
        required: false
        summary: "{{fields.name}} · {{fields.act_type}}"
        fields:
          - { name: name, label: Name (as on the poster), widget: string }
          - { name: artist, label: Artist page, widget: relation, collection: artists, value_field: "{{slug}}", search_fields: [name, aka], display_fields: [name], required: false }
          - { name: duration, label: Duration / Süre, widget: string, required: false, hint: "e.g. 75 min. Start times go in the Schedule below." }
          - { name: act_type, label: Act type / Performans türü, widget: relation, collection: settings, file: vocab, value_field: "act_types.*.en", search_fields: ["act_types.*.en", "act_types.*.tr"], display_fields: ["act_types.*.en"], multiple: true, required: false, hint: "Pick one or more: DJ Set, Live Set, Concert, Visuals… Add new ones under Site texts → Lists." }
          - { name: note_en, label: Note (EN), widget: string, required: false, hint: "anything extra, e.g. main act · dnb, jungle" }
          - { name: note_tr, label: Not (TR), widget: string, required: false }
          - { name: bio_en, label: Bio for this event (EN), widget: markdown, required: false, hint: "Leave empty to show nothing here; the artist page keeps the main bio." }
          - { name: bio_tr, label: Bu etkinlik için biyografi (TR), widget: markdown, required: false }
      - { name: exhibitors, label: Art market / exhibition, widget: list, required: false, hint: 'names of exhibiting artists' }
      - name: schedule
        label: Schedule / Akış
        widget: list
        required: false
        fields:
          - { name: time, label: Time, widget: string }
          - { name: en, label: EN, widget: string }
          - { name: tr, label: TR, widget: string, required: false }
      - name: videos
        label: Videos (PeerTube)
        widget: list
        required: false
        hint: "Paste the link of a video on our PeerTube channel (v.basspistol.org), e.g. https://v.basspistol.org/w/tSAy9STuRyrbDaHX8J7mAF"
        summary: "{{fields.title}}"
        fields:
          - { name: url, label: PeerTube link, widget: string }
          - { name: title, label: Title, widget: string, required: false }
      - name: gallery
        label: Gallery
        widget: list
        required: false
        fields:
          - { name: src, label: Image, widget: image }
          - { name: alt, label: Description, widget: string }
      - name: recordings
        label: Sound recordings / Ses kayıtları
        widget: list
        required: false
        hint: "Recordings of this event: a SoundCloud playlist or track link. Shown under SOUND RECORDINGS."
        summary: "{{fields.title}}"
        fields:
          - { name: url, label: SoundCloud link, widget: string }
          - { name: title, label: Title, widget: string, required: false }
      - name: listen
        label: Listen (artist players)
        widget: list
        required: false
        hint: 'Players for the artists, e.g. their SoundCloud. SoundCloud links play directly. Bandcamp links need the album/track id (Bandcamp → Share/Embed → the number after album= or track=).'
        fields:
          - { name: url, label: Link, widget: string }
          - { name: title, label: Title, widget: string, required: false }
          - { name: bandcamp_id, label: Bandcamp id (only for Bandcamp), widget: string, required: false }
      - { name: summary_en, label: Short summary for social media (EN), widget: text, required: false }
      - { name: summary_tr, label: Kısa özet (TR), widget: text, required: false }
      - { name: draft, label: Draft (hidden), widget: boolean, default: false, required: false }

  # ---------------------------------------------------------------- RELEASES
  - name: releases
    label: Releases / Yayınlar
    label_singular: Release
    folder: src/releases
    path: "{{year}}-{{month}}-{{day}}-{{slug}}/index"
    create: true
    summary: "{{catalog}} · {{title}} ({{status}})"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: codename, label: Codename, widget: string, required: false }
      - { name: catalog, label: Catalog number, widget: string, required: false, hint: "UNCVL002" }
      - { name: type, label: Type, widget: select, options: [single, ep, album, compilation] }
      - { name: status, label: Status, widget: select, options: [released, upcoming, open-call, planned], default: upcoming }
      - { name: date, label: Release date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false }
      - { name: format, label: Format, widget: string, required: false, default: Digital Album }
      - { name: artist_line, label: Artist line, widget: string, hint: "as written on Bandcamp" }
      - { name: artists, label: Artists, widget: relation, collection: artists, value_field: "{{slug}}", search_fields: [name, aka], display_fields: [name], multiple: true, required: false }
      - { name: flavor, label: Flavor, widget: string, required: false, hint: "Free text, shown next to the release type, e.g. punk ⤬ core" }
      - { name: music_genres, label: Music genres / Müzik türleri, widget: relation, collection: genres, value_field: name, search_fields: [name], display_fields: [name], multiple: true, required: false, hint: "Type to search, pick one or more." }
      - { name: cover, label: Cover art, widget: image, required: false }
      - name: tracklist
        label: Tracklist
        widget: list
        required: false
        summary: "{{fields.title}} {{fields.duration}}"
        fields:
          - { name: title, label: Title, widget: string }
          - { name: artist, label: Artist, widget: string, required: false }
          - { name: duration, label: Duration, widget: string, required: false, hint: "04:08" }
          - { name: url, label: Track link, widget: string, required: false }
      - name: links
        label: Links
        widget: object
        required: false
        fields:
          - { name: bandcamp, label: Bandcamp, widget: string, required: false }
          - { name: soundcloud, label: SoundCloud, widget: string, required: false }
      - name: elsewhere
        label: Also available on
        widget: list
        required: false
        fields:
          - { name: name, label: Name, widget: string, hint: 'Mirlo, Nina Protocol, itch.io…' }
          - { name: url, label: URL, widget: string }
      - { name: bandcamp_id, label: Bandcamp album id, widget: string, required: false, hint: 'Makes the Bandcamp player playable. Bandcamp → Share/Embed → the number after album=' }
      - { name: text_en, label: About (EN), widget: markdown, required: false }
      - { name: text_tr, label: Hakkında (TR), widget: markdown, required: false }
      - { name: credits, label: Credits, widget: markdown, required: false }
      - { name: order, label: Order (unreleased only), widget: number, required: false }
      - { name: draft, label: Draft (hidden), widget: boolean, default: false, required: false }

  # ----------------------------------------------------------------- ARTISTS
  - name: artists
    label: Artists / Sanatçılar
    label_singular: Artist
    folder: src/artists
    create: true
    identifier_field: name
    slug: "{{name}}"
    summary: "{{name}}"
    fields:
      - { name: name, label: Name, widget: string }
      - { name: aka, label: Also known as, widget: list, required: false }
      - name: links
        label: Links
        widget: list
        required: false
        fields:
          - { name: name, label: Name, widget: string, hint: "Bandcamp, SoundCloud, Instagram…" }
          - { name: url, label: URL, widget: string, hint: 'SoundCloud links get a player automatically' }
          - { name: bandcamp_id, label: 'Bandcamp id (optional: for a player)', widget: string, required: false }
      - { name: music_genres, label: Music genres / Müzik türleri, widget: relation, collection: genres, value_field: name, search_fields: [name], display_fields: [name], multiple: true, required: false, hint: "What the artist plays. Type to search, pick one or more." }
      - { name: photo, label: Photo, widget: image, required: false }
      - { name: bio_en, label: Bio (EN), widget: markdown, required: false }
      - { name: bio_tr, label: Biyografi (TR), widget: markdown, required: false }

  # ------------------------------------------------------------------- POSTS
  - name: posts
    label: Posts / Yazılar
    label_singular: Post
    folder: src/posts
    path: "{{year}}-{{month}}-{{day}}-{{slug}}"
    create: true
    summary: "{{date | date('YYYY-MM-DD')}} · {{title}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: kind, label: Kind, widget: select, options: [post, news, open-call, release], default: post }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: text_en, label: Text (EN), widget: markdown, required: false }
      - { name: text_tr, label: Metin (TR), widget: markdown, required: false }
      - name: listen
        label: Listen (SoundCloud / Bandcamp players)
        widget: list
        required: false
        hint: 'SoundCloud links play directly. Bandcamp links need the album/track id (Bandcamp → Share/Embed → the number after album= or track=).'
        fields:
          - { name: url, label: Link, widget: string }
          - { name: title, label: Title, widget: string, required: false }
          - { name: bandcamp_id, label: Bandcamp id (only for Bandcamp), widget: string, required: false }
      - { name: draft, label: Draft (hidden), widget: boolean, default: false, required: false }

  # ------------------------------------------------------------------- CALLS
  - name: calls
    label: Calls / Çağrılar
    label_singular: Call
    folder: src/calls
    create: true
    identifier_field: title_en
    slug: "{{title_en}}"
    summary: "{{title_en}} ({{status}})"
    fields:
      - { name: title_en, label: Title (EN), widget: string }
      - { name: title_tr, label: Başlık (TR), widget: string, required: false }
      - { name: status, label: Status, widget: select, options: [open, closed], default: open, hint: "Open calls are shown in the CALLS box on the home page." }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false }
      - { name: kline, label: Small line above the title, widget: string, required: false, default: "[:CALL:]" }
      - { name: description, label: "Short description (search engines and link previews)", widget: text, required: false }
      - { name: box_head_en, label: Home box heading (EN), widget: text, required: false, hint: "The orange box on the home page" }
      - { name: box_head_tr, label: Anasayfa kutusu başlığı (TR), widget: text, required: false }
      - { name: box_body_en, label: Home box text (EN), widget: markdown, required: false }
      - { name: box_body_tr, label: Anasayfa kutusu metni (TR), widget: markdown, required: false }
      - { name: text_en, label: Full call (EN), widget: markdown, required: false, hint: "If empty, the Turkish text is shown with a 'needs translation' note." }
      - { name: text_tr, label: Çağrının tamamı (TR), widget: markdown, required: false }
      - name: chips
        label: Jump links at the top
        widget: list
        required: false
        hint: 'Links to headings in the text: "#" + the heading in lower case with dashes, e.g. ## Modlar / Mods → #modlar-mods'
        summary: "{{fields.en}} → {{fields.href}}"
        fields:
          - { name: en, label: Label (EN), widget: string }
          - { name: tr, label: Etiket (TR), widget: string, required: false }
          - { name: href, label: Link, widget: string }
      - { name: draft, label: Draft (hidden), widget: boolean, default: false, required: false }

  # ------------------------------------------------------------------- SOUND
  - name: genres
    label: "Sound: Genres / Ses: Türler"
    label_singular: Genre
    folder: src/sound/genres
    create: true
    identifier_field: name
    slug: "{{name}}"
    summary: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Name, widget: string, hint: "As it should appear on events, e.g. Drum & Bass" }
      - { name: supergenres, label: Supergenres / Üst türler, widget: relation, collection: supergenres, value_field: name, search_fields: [name, code], display_fields: ["{{code}} {{name}}"], multiple: true, required: false }
      - { name: order, label: Position in the list, widget: number, required: false, hint: "Genres are listed by this number (the sorted list of the team)." }
      - { name: description_en, label: Description (EN), widget: markdown, required: false }
      - { name: description_tr, label: Açıklama (TR), widget: markdown, required: false }
      - name: links
        label: See also (links)
        widget: list
        required: false
        summary: "{{fields.name}}"
        fields:
          - { name: name, label: Name, widget: string, hint: "RateYourMusic, MusicBrainz…" }
          - { name: url, label: URL, widget: string }
      - { name: draft, label: Draft (hidden), widget: boolean, default: false, required: false }

  - name: supergenres
    label: "Sound: Supergenres / Ses: Üst türler"
    label_singular: Supergenre
    folder: src/sound/supergenres
    create: true
    identifier_field: name
    slug: "{{name}}"
    summary: "{{code}} · {{name}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: code, label: Letter code, widget: string, hint: "One letter, e.g. B for Bass" }
      - { name: order, label: Position in the list, widget: number, required: false }
      - { name: description_en, label: Description (EN), widget: markdown, required: false }
      - { name: description_tr, label: Açıklama (TR), widget: markdown, required: false }
      - { name: draft, label: Draft (hidden), widget: boolean, default: false, required: false }

  - name: work_units
    label: Work units / Çalışma birimleri
    label_singular: Work unit
    folder: src/work-units
    create: true
    identifier_field: name
    slug: "{{name}}"
    summary: "{{name}} · {{department}} · {{status}}"
    sortable_fields: [order, name]
    description: "Groups people can join, shown as cards on the Organization page (/organization/)."
    fields:
      - { name: name, label: Name, widget: string, hint: "e.g. U Label" }
      - { name: type, label: Type / Tür, widget: select, options: [PROJECT, WORK, ORG], default: WORK }
      - { name: department, label: Department / Bölüm, widget: select, options: [ACTION, RESEARCH, PRODUCTION, TECH] }
      - name: status
        label: Joining / Katılım
        widget: select
        default: open
        options:
          - { label: "Open to join / Katılıma açık", value: open }
          - { label: "Open to applications / Başvurulara açık", value: applications }
          - { label: "Not looking for people right now / Şu an katılıma ihtiyaç yok", value: closed }
      - { name: note_en, label: Who can join (EN), widget: markdown, required: false }
      - { name: note_tr, label: Kimler katılabilir (TR), widget: markdown, required: false }
      - { name: text_en, label: What we do / updates (EN), widget: markdown, required: false, hint: "A short list works best." }
      - { name: text_tr, label: Ne yapıyoruz / gelişmeler (TR), widget: markdown, required: false }
      - { name: order, label: Position in the list, widget: number, required: false }
      - { name: draft, label: Draft (hidden), widget: boolean, default: false, required: false }

  # ---------------------------------------------------------- SITE-WIDE TEXT
  - name: settings
    label: Site texts / Site metinleri
    files:
      - name: home
        label: Home page texts / Anasayfa metinleri
        file: src/_data/home.json
        format: json
        fields:
          - { name: intro_en, label: Intro (EN), widget: markdown }
          - { name: intro_tr, label: Giriş (TR), widget: markdown }
          - name: notes
            label: Notes / Notlar
            widget: list
            summary: "{{fields.text_en}}"
            hint: "If one language is empty, the other one is shown."
            fields:
              - { name: text_en, label: Text (EN), widget: markdown }
              - { name: text_tr, label: Metin (TR), widget: markdown, required: false }
              - { name: more_en, label: Small print (EN), widget: markdown, required: false }
              - { name: more_tr, label: Küçük not (TR), widget: markdown, required: false }
      - name: about
        label: About page / Hakkında sayfası
        file: src/pages/about.md
        fields:
          - { name: title_en, label: Title (EN), widget: string }
          - { name: title_tr, label: Başlık (TR), widget: string, required: false }
          - { name: description, label: "Short description (search engines and link previews)", widget: text, required: false }
          - { name: text_en, label: Text (EN), widget: markdown }
          - { name: text_tr, label: Metin (TR), widget: markdown }
          - { name: body, label: Notes above the genre list, widget: markdown, required: false, hint: "The genre list itself comes from Sound → Genres." }
          - { name: genre_list_label, label: Genre list intro, widget: string, required: false, hint: "Shown before the genre list. Empty = no genre list on the page." }
      - name: concept
        label: Concept page / Konsept sayfası
        file: src/pages/concept.md
        fields:
          - { name: title_en, label: Title (EN), widget: string }
          - { name: title_tr, label: Başlık (TR), widget: string, required: false }
          - { name: description, label: "Short description (search engines and link previews)", widget: text, required: false }
          - { name: text_en, label: Intro (EN), widget: markdown, required: false }
          - { name: text_tr, label: Giriş (TR), widget: markdown, required: false }
          - name: blocks
            label: Blocks / Bloklar
            label_singular: Block
            widget: list
            summary: "{{fields.title_en}}"
            hint: "Boxes under the intro, each with a heading, a short text and an optional link (e.g. /sound/). Drag to reorder."
            fields:
              - { name: title_en, label: Heading (EN), widget: string }
              - { name: title_tr, label: Başlık (TR), widget: string, required: false }
              - { name: text_en, label: Text (EN), widget: markdown }
              - { name: text_tr, label: Metin (TR), widget: markdown, required: false }
              - { name: link, label: Link, widget: string, required: false, hint: "A page on this site like /sound/ or /concept/world-building/, or a full https:// address. Empty = no link." }
              - { name: link_label_en, label: Link text (EN), widget: string, required: false }
              - { name: link_label_tr, label: Link metni (TR), widget: string, required: false }
      - name: world_building
        label: World Building Project page / Dünya Oluşturma Projesi sayfası
        file: src/pages/world-building.md
        fields:
          - { name: title_en, label: Title (EN), widget: string }
          - { name: title_tr, label: Başlık (TR), widget: string, required: false }
          - { name: description, label: "Short description (search engines and link previews)", widget: text, required: false }
          - { name: text_en, label: Text (EN), widget: markdown, hint: "## for main sections, ### for sub-sections. The four jump links at the top point to the ## headings — keep their wording or ask for the links to be updated." }
          - { name: text_tr, label: Metin (TR), widget: markdown, required: false }
      - name: organization
        label: Organization page / Organizasyon sayfası
        file: src/pages/organization.md
        fields:
          - { name: title_en, label: Title (EN), widget: string }
