# Build + check + deploy uncvl.xyz on Codeberg (Forgejo Actions).
#
# Required repository secrets (Settings → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN   – account token with "Workers Scripts: Edit", plus for the uncvl.xyz zone
#                            "Workers Routes: Edit" and "Zone: Read" (custom domain in wrangler.jsonc)
#   CLOUDFLARE_ACCOUNT_ID
# Codeberg Actions must be enabled for the repo (Settings → Units → Actions).
#
# Deploys: push to main / daily schedule → production Worker "uncvl" on uncvl.xyz (wrangler.jsonc).
#          pull requests only build and check.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # daily rebuild so "upcoming" rolls over into "past" without a commit
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER: wrangler@4.151.3

jobs:
  build:
    # codeberg-medium (4 CPU, 10 min): shorter queue and headroom for images not yet moved to R2
    runs-on: codeberg-medium
    container:
      image: node:22-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Cache image output
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: .cache
          key: eleventy-img-${{ hashFiles('src/**/*.jpg', 'src/**/*.png') }}
          restore-keys: eleventy-img-

      - name: Install (exact versions from package-lock.json)
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Check output (links, alt text, CSP-safe markup)
        run: npm run check

      - name: Deploy to Cloudflare (Worker with static assets)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        # The repo (and so this log) is public: wrangler prints the Cloudflare account name, which can
        # contain an e-mail address. Redact anything e-mail-like; pipefail keeps wrangler's exit code.
        run: |
          set -o pipefail
          npx --yes "$WRANGLER" deploy 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted]/g'

      # Alternative host: Codeberg git-pages (uncomment and remove the Cloudflare step).
      # See https://docs.codeberg.org/codeberg-pages/forgejo-actions/
